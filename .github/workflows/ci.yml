name: CI & Syntax Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check Syntax & Compilation
      run: |
        python3 -m py_compile agyswap.py bin/agyswap

    - name: Test Pip Package Build & Installation
      run: |
        pip install .
        agyswap --version
        agyswap --help
        agyswap list
        agyswap audit

    - name: Test Local Installer
      run: |
        ./install.sh
        ~/.local/bin/agyswap --version
