<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-orbit-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logo-orbit-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="logo-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Squircle -->
    <rect width="100" height="100" rx="22" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    
    <!-- Aura -->
    <circle cx="50" cy="50" r="26" fill="url(#logo-core-glow)"/>

    <!-- Orbit 1 -->
    <ellipse cx="50" cy="50" rx="34" ry="14" fill="none" stroke="url(#logo-orbit-1)" stroke-width="3.8" stroke-linecap="round" transform="rotate(-30 50 50)" filter="url(#logo-glow)"/>
    
    <!-- Orbit 2 -->
    <ellipse cx="50" cy="50" rx="34" ry="14" fill="none" stroke="url(#logo-orbit-2)" stroke-width="3.8" stroke-linecap="round" transform="rotate(35 50 50)" stroke-dasharray="64 14 28 10" filter="url(#logo-glow)"/>

    <!-- Satellites -->
    <circle cx="75" cy="35" r="4" fill="#60A5FA" stroke="#0D1117" stroke-width="1.2"/>
    <circle cx="25" cy="65" r="4" fill="#34D399" stroke="#0D1117" stroke-width="1.2"/>
    <circle cx="30" cy="32" r="2.8" fill="#38BDF8"/>

    <!-- Core -->
    <circle cx="50" cy="50" r="6" fill="#F8FAFC" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="50" cy="50" r="2" fill="#0D1117"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(130, 0)">
    <!-- Brand Title -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="850" letter-spacing="-0.03em" fill="#F8FAFC">
      agy<tspan fill="#38BDF8">swap</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="94" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" letter-spacing="0.06em" fill="#8B949E">
      ANTIGRAVITY CLI SESSION MANAGER
    </text>
  </g>
</svg>
