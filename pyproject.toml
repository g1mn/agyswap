[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agyswap"
version = "0.3.0"
description = "Antigravity (agy) CLI Multi-Account Switcher & Session Manager"
readme = "README.md"
authors = [
    { name = "g1mn" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["antigravity", "agy", "google-antigravity", "account-switcher", "cli", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities"
]

[project.scripts]
agyswap = "agyswap:main"

[project.optional-dependencies]
context = [
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.0",
]

[project.urls]
Repository = "https://github.com/g1mn/agyswap"
