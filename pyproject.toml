[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agyswap"
version = "0.6.0"
description = "Antigravity (agy) CLI Multi-Account Switcher & Session Manager"
readme = "README.md"
authors = [
    { name = "g1mn" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["antigravity", "agy", "google-antigravity", "account-switcher", "cli", "gemini", "mcp", "rate-limit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities"
]
dependencies = [
    "rich>=13.0",
    "textual>=1.0",
]

[project.scripts]
agyswap = "agyswap:main"

[project.urls]
Homepage = "https://g1mn.github.io/agyswap/"
Documentation = "https://g1mn.github.io/agyswap/"
Repository = "https://github.com/g1mn/agyswap"
Issues = "https://github.com/g1mn/agyswap/issues"
Changelog = "https://github.com/g1mn/agyswap/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
include = [
    "agyswap.py",
    "modules/**/*.py",
    "modules/**/*.tcss",
]
