<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-orbit-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-orbit-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="grad-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas (Rounded Squircle) -->
  <rect width="128" height="128" rx="28" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Glowing Core Aura -->
  <circle cx="64" cy="64" r="32" fill="url(#grad-core)"/>

  <!-- Antigravity Orbit 1 (Blue - Vertical Tilt) -->
  <ellipse cx="64" cy="64" rx="42" ry="18" fill="none" stroke="url(#grad-orbit-1)" stroke-width="4.5" stroke-linecap="round" transform="rotate(-30 64 64)" filter="url(#glow)"/>
  
  <!-- Antigravity Orbit 2 (Green - Horizontal Tilt) -->
  <ellipse cx="64" cy="64" rx="42" ry="18" fill="none" stroke="url(#grad-orbit-2)" stroke-width="4.5" stroke-linecap="round" transform="rotate(35 64 64)" stroke-dasharray="80 16 35 12" filter="url(#glow)"/>

  <!-- Swapping Orbital Nodes (Satellites) -->
  <!-- Satellite 1: Top Right (Cyan/Blue) -->
  <circle cx="95" cy="46" r="5" fill="#60A5FA" stroke="#0D1117" stroke-width="1.5"/>
  <!-- Satellite 2: Bottom Left (Emerald/Green) -->
  <circle cx="33" cy="82" r="5" fill="#34D399" stroke="#0D1117" stroke-width="1.5"/>
  <!-- Satellite 3: Top Left (Accent Glow) -->
  <circle cx="38" cy="42" r="3.5" fill="#38BDF8"/>

  <!-- Center Keyhole / Core Node -->
  <circle cx="64" cy="64" r="7.5" fill="#F8FAFC" stroke="#3B82F6" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="2.5" fill="#0D1117"/>
</svg>
